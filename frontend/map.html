<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arkansas Election Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #bar { padding: 8px 12px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid #ccc; }
    #bar h1 { font-size: 16px; margin: 0; }
    #map { position: absolute; top: 37px; bottom: 0; left: 0; right: 0; }
    #results { position: absolute; top: 49px; right: 12px; z-index: 1000; background: rgba(255,255,255,0.92);
               padding: 10px 14px; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.3);
               max-height: calc(100% - 61px); overflow-y: auto; font-size: 14px; }
    #results:empty { display: none; }
    #results h2 { font-size: 16px; margin: 0 0 8px; }
    #results td { padding: 2px 8px; }
    #results td.n, #results th.n { text-align: right; }
    #results summary { font-size: 14px; font-weight: bold; margin: 14px 0 6px; cursor: pointer; user-select: none; }
    #results summary:hover { color: #2b6cb0; }
    #counties { border-collapse: collapse; }
    #counties th { position: sticky; top: -10px; background: #fff; padding: 4px 8px; cursor: pointer;
                   user-select: none; white-space: nowrap; border-bottom: 1px solid #ccc; text-align: left; }
    #counties th:hover { background: #edf2f7; }
    #counties th[data-dir="asc"]::after { content: " ▲"; font-size: 10px; }
    #counties th[data-dir="desc"]::after { content: " ▼"; font-size: 10px; }
    #counties tbody tr:nth-child(even) { background: rgba(0,0,0,0.035); }
    .legend { background: #fff; padding: 6px 8px; font-size: 12px; line-height: 18px; }
    .legend i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: middle; }
    .tip td { padding: 0 4px; }
    .tip td.n { text-align: right; }
  </style>
</head>
<body>
  <div id="bar">
    <h1 id="heading"></h1>
    <span id="status">Loading…</span>
  </div>
  <div id="map"></div>
  <div id="results"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script>
    // CARTO basemap API key (https://carto.com/basemaps/apikey)
    const CARTO_KEY = "cb1_54wu_1_bc9bd507a7a48316c5d6933d";

    const COUNTIES_URL =
      "https://gis.arkansas.gov/arcgis/rest/services/FEATURESERVICES/Boundaries/FeatureServer/48/query" +
      "?outFields=county&where=1%3D1&outSR=4326&f=geojson&geometryPrecision=5&maxAllowableOffset=0.002";
    // Data file for each year (all must share the 1996 sheet layout parsed below)
    const FILES = {
      1996: "../data/raw/ark_gen_election_data/ark_gen_96.xls",
    };

    // Election chosen via the link, e.g. map.html?year=1996&race=U.S.%20SENATE
    const params = new URLSearchParams(location.search);
    const YEAR = params.get("year");
    const RACE = params.get("race");
    const XLS_URL = FILES[YEAR];
    document.getElementById("heading").textContent = `${YEAR} ${RACE} — Arkansas`;
    document.title = `Arkansas ${YEAR} ${RACE}`;
    const COLORS = { DEMOCRAT: "#2b6cb0", REPUBLICAN: "#c53030" };

    // Same as senate_96 in data/processed/test.ipynb: rows under the race header
    // until the next blank row; row 0 holds county names (cols 2+), col 1 is party.
    function parseRace(rows, race) {
      const counties = rows[0].slice(2).map(c => String(c).trim());
      const start = rows.findIndex(r => String(r[0] ?? "").trim() === race) + 1;
      const candidates = [];
      for (let i = start; i < rows.length && rows[i][0] != null; i++) {
        const votes = {};
        counties.forEach((c, j) => { if (c !== "TOTAL") votes[c] = rows[i][j + 2]; });
        candidates.push({ name: String(rows[i][0]).trim(), party: String(rows[i][1]).trim(), votes });
      }
      return candidates;
    }

    // Locked view: no zooming or panning by the user
    const map = L.map("map", {
      zoomControl: false, scrollWheelZoom: false, doubleClickZoom: false,
      touchZoom: false, boxZoom: false, keyboard: false, dragging: false,
      zoomSnap: 0, // fit the state exactly instead of rounding down to a whole zoom level
    }).setView([34.8, -92.4], 7);
    L.tileLayer(`https://basemaps.cartocdn.com/rastertiles/light_nolabels/{z}/{x}/{y}{r}.png?key=${CARTO_KEY}`, {
      attribution: "&copy; OpenStreetMap contributors &copy; CARTO | Boundaries: Arkansas GIS Office",
      maxNativeZoom: 18, maxZoom: 20,
    }).addTo(map);

    Promise.all([
      fetch(COUNTIES_URL).then(r => r.json()),
      (XLS_URL ? fetch(XLS_URL) : Promise.reject(new Error(`No data file for ${YEAR}`))).then(r => { if (!r.ok) throw new Error(`Could not load ${XLS_URL}`); return r.arrayBuffer(); }),
    ]).then(([geo, buf]) => {
      const wb = XLSX.read(buf, { type: "array" });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: null });
      const candidates = parseRace(rows, RACE);

      const layer = L.geoJSON(geo, {
        style: { color: "#fff", weight: 1 },
        onEachFeature: (f, lyr) => {
          const county = f.properties.county.toUpperCase();
          const results = candidates.map(c => ({ c, v: c.votes[county] || 0 })).sort((a, b) => b.v - a.v);
          const total = results.reduce((s, r) => s + r.v, 0);
          const share = results[0].v / total;
          lyr.setStyle({
            fillColor: COLORS[results[0].c.party] || "#718096",
            fillOpacity: 0.3 + 0.7 * Math.min(1, Math.max(0, (share - 0.5) / 0.3)),
          });
          lyr.bindTooltip(
            `<b>${f.properties.county} County</b><table>` + results.map(r =>
              `<tr><td>${r.c.name} (${r.c.party})</td><td class="n">${r.v.toLocaleString()}</td>` +
              `<td class="n">${(100 * r.v / total).toFixed(1)}%</td></tr>`).join("") + "</table>",
            { sticky: true, className: "tip" });
        },
      }).addTo(map);
      // Right-side padding matches the results panel so the state sits to its left, not under it
      const resultsEl = document.getElementById("results");
      const fit = () => map.fitBounds(layer.getBounds(), {
        paddingTopLeft: [10, 10],
        paddingBottomRight: [resultsEl.offsetWidth + 24, 10],
      });
      window.addEventListener("resize", fit);

      const legend = L.control({ position: "bottomright" });
      legend.onAdd = () => {
        const div = L.DomUtil.create("div", "legend");
        div.innerHTML = "<b>County winner</b><br>" + candidates.map(c =>
          `<i style="background:${COLORS[c.party] || "#718096"}"></i>${c.name}`).join("<br>") +
          "<br><small>Darker = larger margin</small>";
        return div;
      };
      legend.addTo(map);

      // Overall (statewide) results: sum of county votes per candidate
      const totals = candidates.map(c => ({ c, v: Object.values(c.votes).reduce((s, x) => s + (x || 0), 0) }))
        .sort((a, b) => b.v - a.v);
      const stateTotal = totals.reduce((s, r) => s + r.v, 0);
      document.getElementById("results").innerHTML = "<h2>Overall Results</h2><table>" + totals.map(r =>
        `<tr><td>${r.c.name} (${r.c.party})</td><td class="n">${r.v.toLocaleString()}</td>` +
        `<td class="n">${(100 * r.v / stateTotal).toFixed(1)}%</td></tr>`).join("") + "</table>" +
        "<details id=\"county-details\"><summary>Results by County</summary>" +
        "<table id=\"counties\"><thead></thead><tbody></tbody></table></details>";

      // Sortable county table: one row per county, a vote-share column per candidate
      const countyRows = Object.keys(candidates[0].votes).map(county => {
        const v = candidates.map(c => c.votes[county] || 0);
        const total = v.reduce((s, x) => s + x, 0);
        const name = county.toLowerCase().replace(/\b\w/g, ch => ch.toUpperCase());
        return { name, pct: v.map(x => total ? 100 * x / total : 0), total };
      });
      const columns = [
        { label: "County", key: r => r.name },
        ...candidates.map((c, i) => ({ label: c.name, key: r => r.pct[i], num: true })),
        { label: "Total votes", key: r => r.total, num: true },
      ];
      const table = document.getElementById("counties");
      let sortCol = 0, sortDir = "asc";
      function renderCounties() {
        const { key } = columns[sortCol];
        const sorted = [...countyRows].sort((a, b) => {
          const x = key(a), y = key(b);
          const cmp = typeof x === "string" ? x.localeCompare(y) : x - y;
          return sortDir === "asc" ? cmp : -cmp;
        });
        table.tHead.innerHTML = "<tr>" + columns.map((col, i) =>
          `<th class="${col.num ? "n" : ""}" data-col="${i}"${i === sortCol ? ` data-dir="${sortDir}"` : ""}>${col.label}</th>`
        ).join("") + "</tr>";
        table.tBodies[0].innerHTML = sorted.map(r =>
          `<tr><td>${r.name}</td>` + r.pct.map(p => `<td class="n">${p.toFixed(1)}%</td>`).join("") +
          `<td class="n">${r.total.toLocaleString()}</td></tr>`).join("");
      }
      table.tHead.addEventListener("click", e => {
        const th = e.target.closest("th");
        if (!th) return;
        const i = +th.dataset.col;
        // Same column toggles direction; new column starts descending for numbers, A–Z for names
        sortDir = i === sortCol ? (sortDir === "asc" ? "desc" : "asc") : (columns[i].num ? "desc" : "asc");
        sortCol = i;
        renderCounties();
      });
      renderCounties();
      fit();
      // Expanding/collapsing the table changes the panel width, so refit the map
      document.getElementById("county-details").addEventListener("toggle", fit);
      document.getElementById("status").textContent = "";
    }).catch(err => {
      document.getElementById("status").textContent = "Error: " + err.message;
      console.error(err);
    });
  </script>
</body>
</html>
